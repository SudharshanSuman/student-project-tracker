name: Android APK

# Builds a debug APK of the Capacitor shell in apps/mobile and uploads it as a
# workflow artifact. Run it by hand (Actions → Android APK → Run workflow) to
# choose which server the app loads; pushes that touch the app use the default.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "URL of the IIC web app the APK should load (https:// for production)"
        required: true
        default: "http://192.168.83.45:3000"
  push:
    paths:
      - "apps/mobile/**"
      - "apps/web/src/lib/native-scan.ts"
      - "apps/web/src/app/(app)/attendance/check-in/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || 'http://192.168.83.45:3000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # Scripts are skipped: the APK needs only the Capacitor packages, not Prisma or the dev database.
      - run: npm ci --ignore-scripts

      - name: Sync Capacitor config and plugins into the Android project
        run: npm run sync -w @iic/mobile

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: iic-platform-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
